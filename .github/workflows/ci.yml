name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Actions are pinned to commit hashes, so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install the browser the end-to-end tests use
        run: npx playwright install --with-deps chromium

      # Only the services the tests use: Postgres, Auth, the REST API, its gateway, and
      # postgres-meta for type generation.
      - name: Start local Supabase
        run: npx supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,mailpit

      # The same gate the Claude Code hook runs before a PR is opened.
      - run: npm run check:full

      # Development tools never reach the browser, so only shipped packages block the build.
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Keep the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
